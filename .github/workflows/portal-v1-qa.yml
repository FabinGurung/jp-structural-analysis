name: Portal V2 four-section source-first site QA

on:
  pull_request:
    paths:
      - "portal/**"
      - ".github/workflows/portal-v1-qa.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "portal/**"
      - ".github/workflows/portal-v1-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-information-architecture:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install responsive browser and test dependencies
        run: |
          python -m pip install 'pytest>=8,<9' playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Static four-route information architecture, governance and source hold tests
        run: |
          python -m pytest -q portal/test_portal.py
          node --check portal/site-system.js
      - name: Read back exact existing publicly published independent Narayani report
        run: |
          python - <<'PY'
          import time,urllib.request
          from pathlib import Path
          root="https://fabingurung.github.io/jp-structural-analysis/"
          files=(
              "reports/r6p26/narayani-independent-frame-results.json",
              "reports/r6p26/narayani-verified-manifest.json",
          )
          for file in files:
              path=Path("build/preview-site")/file
              path.parent.mkdir(exist_ok=True,parents=True)
              for attempt in range(4):
                  try:
                      req=urllib.request.Request(root+file,
                        headers={"User-Agent":"JP-Portal-V1-Source-Integrity-QA",
                                 "Cache-Control":"no-cache"})
                      raw=urllib.request.urlopen(req,timeout=25).read()
                      assert len(raw)>1000
                      path.write_bytes(raw)
                      break
                  except Exception:
                      if attempt==3:raise
                      time.sleep(3)
          path=Path("build/preview-site")
          (path/"index.html").write_text(
              '<!doctype html><title>Old Home</title><a href="report.html">Legacy report</a>')
          (path/"more.html").write_text(
              '<!doctype html><title>Old Methods</title><a href="report.html">Legacy report</a>')
          print("JP_PORTAL_SOURCE_REPORT_ORIGINAL_RECEIPT_READBACK")
          PY
      - name: Build genuine R6.26-backed portal (not synthetic or arbitrary model counts)
        run: |
          python portal/build.py --site-dir build/preview-site
          python portal/build.py --site-dir build/preview-site --verify-only
      - name: Real 390px phone, 768px tablet and 1440px desktop browser QA
        run: |
          python portal/browser_smoke.py --site-dir build/preview-site --screenshots build/portal-ui-qa
      - name: Retain reviewed navigation QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: JP-Structural-Portal-V2-Responsive-QA-Not-Design-Approved
          path: build/portal-ui-qa/
          if-no-files-found: error
