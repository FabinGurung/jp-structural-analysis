name: Structural Report Engine — Tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned OpenSeesPy and tests
        run: python -m pip install -r requirements.txt
      - name: Verify actual OpenSees calculations and beam/column design checks
        run: python -m pytest -q r6p30/test_beam_design.py r6p30/test_column_pmm.py r6p30/test_footing_f3.py r6p30/test_slab_design.py r6p30/test_staircase_review.py r6p30/test_staircase_geometry.py r6p30/test_staircase_loads.py tests/test_product.py
