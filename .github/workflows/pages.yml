name: Publish structural website
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: structural-website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify publication content
        run: python verify_site.py
      - name: Store website preview
        uses: actions/upload-artifact@v4
        with:
          name: structural-website
          path: site/
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify served website against publication
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import pathlib, os, time, urllib.request
          base=os.environ['SITE_URL'].rstrip('/')+'/'
          for attempt in range(15):
              try:
                  for p in pathlib.Path('site').iterdir():
                      req=urllib.request.Request(base+p.name+'?check='+str(attempt),headers={'Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req,timeout=20) as res:
                          assert res.read()==p.read_bytes(), p.name
                  print('All published files match the validated website.')
                  break
              except Exception as exc:
                  if attempt == 14: raise
                  print(str(exc)[:160])
                  time.sleep(5)
          PY
