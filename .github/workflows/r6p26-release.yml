name: R6.26 independent report SOFTWARE milestone (Engineering HOLD)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r6p26-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: r6p26-report-software-release
  cancel-in-progress: false

jobs:
  freeze-verified-report:
    runs-on: ubuntu-24.04
    env:
      TAG: r6.26-report-preview
      TARGET_SHA: 1d6394d1d871b070d17f056b6eec4c74efdfb3af
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify two independent QA and live Pages runs at immutable target
        run: |
          set -euo pipefail
          git cat-file -e "$TARGET_SHA^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          test -f audit/R6P26_SOFTWARE_RELEASE_NOTES_20261116.md
          for id in 43607241579 43607241584; do
            conclusion="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .conclusion)"
            source="$(gh api "repos/$GH_REPO/actions/runs/$id" --jq .head_sha)"
            test "$conclusion" = success || { echo "::error::Unverified original run $id"; exit 1; }
            test "$source" = "$TARGET_SHA" || { echo "::error::CI source differs from tag target"; exit 1; }
          done
          echo "Release candidate source and both independent CI receipts match"
      - name: Create immutable annotated release tag without rewriting prior tags
        run: |
          set -euo pipefail
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n1 "$TAG")" = "$TARGET_SHA" || {
              echo "::error::Existing tag points to different commit; do not rewrite"; exit 1;
            }
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "R6.26 independent Narayani structural-report software preview; engineering HOLD"
            git push origin "refs/tags/$TAG"
          fi
          test "$(git rev-list -n1 "$TAG")" = "$TARGET_SHA"
      - name: Create or verify guarded software-only GitHub prerelease
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isPrerelease,isDraft --jq '.isPrerelease == true and .isDraft == false')" = true
          else
            gh release create "$TAG" --verify-tag --prerelease \
              --title 'R6.26 — Narayani Independent Structural Report · SOFTWARE PREVIEW · ENGINEERING HOLD' \
              --notes-file audit/R6P26_SOFTWARE_RELEASE_NOTES_20261116.md
          fi
          test "$(gh release view "$TAG" --json tagName,isPrerelease,isDraft --jq '.tagName == "r6.26-report-preview" and .isPrerelease == true and .isDraft == false')" = true
          echo "R6P26_SOFTWARE_PRERELEASE_VERIFIED_NOT_ENGINEERING_APPROVED"
