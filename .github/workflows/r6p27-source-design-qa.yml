name: R6.27 real Narayani dimension-and-design source crosswalk QA

on:
  pull_request:
    paths:
      - "r6p27/**"
      - "portal/**"
      - ".github/workflows/r6p27-source-design-qa.yml"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "r6p27/**"
      - ".github/workflows/r6p27-source-design-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-design-crosswalk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Pin original-DXF-derived Narayani architectural and structural registers
        uses: actions/checkout@v6
        with:
          repository: FabinGurung/jp-drawing-coordination
          ref: 259d11e1543e4ba7040373a752b823396e12d7f8
          path: drawing-source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install independently solvable 3D OpenSees and test suite
        run: python -m pip install openseespy==3.8.0.0 'pytest>=8,<9'
      - name: Execute fresh exact OpenSees R6.26 frame from original DXF candidate source
        run: |
          python -m r6p26.publish --cad-root drawing-source --site-dir build/site
      - name: Verify native 21-footing / 23-column and source geotechnical and code arithmetic
        env:
          R6P25_CAD_ROOT: drawing-source
          R6P27_SITE: build/site
        run: |
          python -m pytest -q r6p27/test_source_design.py
      - name: Independently verify original F3 one-way shear worksheet and preserve adverse verdict
        run: |
          python -m pytest -q r6p27/test_f3_oneway_verification.py
          python -m r6p27.f3_oneway_verification --output build/site/data/narayani-f3-oneway-verification.v1.json
          python - <<'PY'
          import json
          d=json.load(open("build/site/data/narayani-f3-oneway-verification.v1.json"))
          assert d["original_f3_not_safe_preserved"] and not d["engineering_approval"]
          assert d["physical_footing_code_compliant"] is None
          PY
      - name: Independently solve R6.23 synthetic frame shell and verify six-chapter engine report generator
        run: |
          python -m pytest -q portal/test_engine_atlas.py r6p30/test_beam_design.py
      - name: Write exact reported-source column steel ratio, G1 concrete delta and trial support mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          from r6p27.source_design import publish
          receipt=publish(Path("drawing-source"),Path("build/site"))
          print("R6P27_21_FOOTINGS_23_COLUMNS_CALCULATED",receipt)
          PY
      - name: Keep source-derived evidence and SHA receipts (not permit drawings)
        uses: actions/upload-artifact@v4
        with:
          name: R6P27-Actual-Source-Dimensions-and-Code-Review-NOT-IFC
          path: |
            build/site/r6p27-construction-review.html
            build/site/reports/r6p27/
          if-no-files-found: error
